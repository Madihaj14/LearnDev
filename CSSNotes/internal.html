<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS Example</title>
    <style> /* Internal CSS */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        } /* This styles the body */
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
            text-align: center;
        } /* This styles the header */
        nav {
            margin: 10px 0;
        } /* This styles the navigation bar */
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #4CAF50;
        } /* This styles the navigation links */
        main {
            padding: 20px;
        } /* This styles the main content area */
        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        } /* This styles the footer */
    </style>
</head>
<body>

<header> 
    <h1>My Website</h1>
</header> <!-- This is the header -->

<nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</nav> <!-- This is the navigation bar -->

<main>
    <h2>Welcome to My Website</h2>
    <p>This is a simple website to demonstrate internal CSS.</p>
</main> <!-- This is the main content area -->

<footer>
    <p>&copy; 2025 My Website</p>
</footer> <!-- This is the footer -->

</body>
</html>
